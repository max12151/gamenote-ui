server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Un avatar est envoyé en data URI base64 et peut approcher les deux mégaoctets ;
    # la limite d'un mégaoctet par défaut ferait échouer l'enregistrement du profil en
    # 413, sans que rien côté application ne l'explique.
    client_max_body_size 4m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # L'interface et l'API partagent la même origine : le front appelle /api/... en
    # relatif, nginx relaie vers le conteneur de l'API. Aucune configuration CORS
    # n'entre en jeu, puisqu'il n'y a plus de requête inter-origines.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # La première réponse d'IGDB peut être lente, et la fiche d'un jeu inconnu
        # attend le délai fixé côté serveur avant d'abandonner.
        proxy_read_timeout 30s;
    }

    # Les fichiers portent une empreinte dans leur nom (outputHashing) : ils peuvent
    # être gardés indéfiniment, un nouveau déploiement produit de nouveaux noms.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Application à page unique : une adresse inconnue de nginx doit rendre index.html
    # et laisser le routeur Angular décider. Sans cette ligne, recharger la page sur
    # /avis/379 renverrait un 404 d'nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
